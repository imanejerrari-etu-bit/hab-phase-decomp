apiVersion: v1
kind: ServiceAccount
metadata:
  name: configmap-patcher
  namespace: mysql-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-patcher
  namespace: mysql-operator
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-patcher
  namespace: mysql-operator
subjects:
- kind: ServiceAccount
  name: configmap-patcher
  namespace: mysql-operator
roleRef:
  kind: Role
  name: configmap-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patcher-script
  namespace: mysql-operator
data:
  patch.py: |
    import urllib.request, urllib.error, json, time, ssl

    TOKEN_FILE = '/var/run/secrets/kubernetes.io/serviceaccount/token'
    CA_FILE    = '/var/run/secrets/kubernetes.io/serviceaccount/ca.crt'
    NAMESPACE  = 'mysql-operator'
    API        = 'https://kubernetes.default.svc'

    def get_token():
        with open(TOKEN_FILE) as f:
            return f.read().strip()

    def k8s_request(method, path, body=None):
        token = get_token()
        ctx = ssl.create_default_context(cafile=CA_FILE)
        url = API + path
        data = json.dumps(body).encode() if body else None
        headers = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/merge-patch+json',
            'Accept': 'application/json'
        }
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, context=ctx) as resp:
            return json.loads(resp.read())

    print('Patcher started', flush=True)
    while True:
        try:
            cms = k8s_request('GET', f'/api/v1/namespaces/{NAMESPACE}/configmaps')
            for cm in cms.get('items', []):
                name = cm['metadata']['name']
                if 'slow-log' in name or 'patcher' in name:
                    continue
                content = cm.get('data', {}).get('my.cnf', '')
                if 'my.cnf = [mysqld]' in content:
                    fixed = content.replace('my.cnf = [mysqld]\n', '')
                    k8s_request('PATCH',
                        f'/api/v1/namespaces/{NAMESPACE}/configmaps/{name}',
                        {'data': {'my.cnf': fixed}})
                    print(f'Patched: {name}', flush=True)
        except Exception as e:
            print(f'Error: {e}', flush=True)
        time.sleep(3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-patcher
  namespace: mysql-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-patcher
  template:
    metadata:
      labels:
        app: configmap-patcher
    spec:
      serviceAccountName: configmap-patcher
      containers:
      - name: patcher
        image: python:3.11-slim
        command: ["python", "/scripts/patch.py"]
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: patcher-script
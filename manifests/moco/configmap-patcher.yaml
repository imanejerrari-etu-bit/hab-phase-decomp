apiVersion: v1
kind: ServiceAccount
metadata:
  name: configmap-patcher
  namespace: mysql-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-patcher
  namespace: mysql-operator
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configmap-patcher
  namespace: mysql-operator
subjects:
- kind: ServiceAccount
  name: configmap-patcher
  namespace: mysql-operator
roleRef:
  kind: Role
  name: configmap-patcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patcher-script
  namespace: mysql-operator
data:
  patch.py: |
    import subprocess, json, time
    while True:
        result = subprocess.run(
            ['kubectl', 'get', 'configmaps', '-n', 'mysql-operator',
             '-l', 'app.kubernetes.io/created-by=moco',
             '-o', 'json'],
            capture_output=True, encoding='utf-8'
        )
        cms = json.loads(result.stdout)
        for cm in cms.get('items', []):
            name = cm['metadata']['name']
            if 'slow-log' in name:
                continue
            content = cm.get('data', {}).get('my.cnf', '')
            if 'my.cnf = [mysqld]' in content:
                fixed = content.replace('my.cnf = [mysqld]\n', '')
                patch = json.dumps({'data': {'my.cnf': fixed}})
                r = subprocess.run(
                    ['kubectl', 'patch', 'configmap', name,
                     '-n', 'mysql-operator', '--type=merge', '-p', patch],
                    capture_output=True, text=True, encoding='utf-8'
                )
                print(f'Patched {name}: {r.stdout.strip()}', flush=True)
        time.sleep(3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configmap-patcher
  namespace: mysql-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configmap-patcher
  template:
    metadata:
      labels:
        app: configmap-patcher
    spec:
      serviceAccountName: configmap-patcher
      containers:
      - name: patcher
        image: python:3.11-slim
        command: ["python", "/scripts/patch.py"]
        volumeMounts:
        - name: script
          mountPath: /scripts
        env:
        - name: KUBERNETES_SERVICE_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      volumes:
      - name: script
        configMap:
          name: patcher-script
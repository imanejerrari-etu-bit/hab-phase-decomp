apiVersion: v1
kind: Namespace
metadata:
  name: pxc-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: pxc-secret
  namespace: pxc-operator
type: Opaque
stringData:
  root: "PXCRoot2025!"
  xtrabackup: "PXCBackup2025!"
  monitor: "PXCMonitor2025!"
  clustercheck: "PXCCheck2025!"
  proxyadmin: "PXCProxy2025!"
  operator: "PXCOper2025!"
  replication: "PXCRepl2025!"
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: pxc-cluster-p
  namespace: pxc-operator
spec:
  crVersion: "1.14.0"
  secretsName: pxc-secret
  allowUnsafeConfigurations: false
  pxc:
    size: 3
    image: percona/percona-xtradb-cluster:8.0.36-28.1
    livenessProbes:
      initialDelaySeconds: 300
      timeoutSeconds: 5
      periodSeconds: 2
      failureThreshold: 3
    readinessProbes:
      initialDelaySeconds: 15
      timeoutSeconds: 15
      periodSeconds: 30
      failureThreshold: 5
    resources:
      requests:
        memory: 512M
        cpu: 250m
      limits:
        memory: 1G
        cpu: 500m
    volumeSpec:
      persistentVolumeClaim:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi
    configuration: |
      [mysqld]
      wsrep_sync_wait=1
      wsrep_provider_options="gcache.size=128M; gcs.fc_limit=100"
      innodb_flush_log_at_trx_commit=1
      sync_binlog=1
  haproxy:
    enabled: true
    size: 1
    image: percona/percona-xtradb-cluster-operator:1.14.0-haproxy
    resources:
      requests:
        memory: 128M
        cpu: 100m